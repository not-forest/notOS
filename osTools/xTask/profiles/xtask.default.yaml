# Default xTask Post Script configuration YAML.
#
# Defines a set of default paramemeters for post-scripting configuration.
#
# **IMPORTANT**
# 
# For specific architecture, only those parameters, which are different from
# the ones defined within this file, must be changed. Usually this implies
# custom toolchain commands.
#
