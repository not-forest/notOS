mandatory: &x86_mandatory
  <<: *core_defaults
  page_table_levels: 4

  cfg:
    <<: *cfg_defaults
    has_virtual_memory: yes

compilation:
  _script: "./kernel.ld"

# x86 architecture-specific memory related constants.
memory: &x86_memory
  # Free memory for kernel-space usage
  kernel_memory_start: 0x100000
  kernel_memory_end: 0xffffff

  # Free memory for user-space usage.
  user_memory_start: 0x1000000
  user_memory_end: 0xfffffff
